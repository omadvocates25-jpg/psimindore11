# ========== CACHING STRATEGY (Reduce Netlify bandwidth) ==========
# Cache assets for 1 year (they have hash/version in name if needed)
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, immutable, max-age=31536000"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, immutable, max-age=31536000"

# Cache external libraries
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Refresh HTML every hour (catches content updates but leverages browser cache)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Gzip compression (enabled by default on Netlify)
[[headers]]
  for = "/*"
  [headers.values]
    Vary = "Accept-Encoding"

# ========== REDIRECTS ==========
# Ensure SPA routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
