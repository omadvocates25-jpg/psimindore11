# ========== CACHING STRATEGY ==========
# app.js/index.html/styles.css have no hash in their filename (they're always
# served from the same URL), so long "immutable"/1-year caching meant browsers
# that had visited once would NEVER pick up new deploys. "no-cache" still lets
# browsers/CDN keep a local copy for speed, but forces a revalidation check
# (cheap 304 response when unchanged) on every load, so fixes always land
# immediately instead of being stuck behind old cached files.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Gzip compression (enabled by default on Netlify)
[[headers]]
  for = "/*"
  [headers.values]
    Vary = "Accept-Encoding"

# ========== FUNCTIONS ==========
# Note: repo root भी "functions/" folder है (Firebase Cloud Functions ke liye, deploy nahi hota abhi) —
# isliye yahan explicitly "netlify/functions" bataya taaki Netlify usse confuse na kare।
[functions]
  directory = "netlify/functions"

# ========== REDIRECTS ==========
# Ensure SPA routing works ("/.netlify/functions/*" hamesha functions ko hi jaata hai, is redirect se pehle)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
